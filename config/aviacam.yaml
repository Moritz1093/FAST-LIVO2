/**:
  ros__parameters:
    # AVIACAM scanner: Livox Avia + Huateng HT-GE134GC (1024x1280, rotated 270 deg), hardware-synced via STM32.
    # Topics as recorded by the scanner: /livox/lidar (CustomMsg), /livox/imu, /camera/image/compressed (JPEG)
    # or /camera/image_raw (mono8). Values are not final yet - use with care.
    common:
      # Compressed (default recording "comp"): /camera/image + compressed -> /camera/image/compressed
      # Raw (recording "raw"):                  /camera/image_raw + raw
      img_topic: "/camera/image"
      img_transport: "compressed"
      lid_topic: "/livox/lidar"
      livox_msg_type: "livox_ros_driver" # CustomMsg type for lidar_type 1: livox_ros_driver (ROS1 bags) | livox_interfaces | livox_ros_driver2
      imu_topic: "/livox/imu"
      img_en: 1
      lidar_en: 1
      ros_driver_bug_fix: false

    extrin_calib:
      extrinsic_T: [0.04165, 0.02326, -0.0284]
      extrinsic_R: [1, 0, 0, 0, 1, 0, 0, 0, 1]
      # Camera-LiDAR extrinsics from FAST-Calib (multi-scene, RMSE 1.39 cm, 2026-10-10)
      Rcl: [ -0.006104, -0.999952, -0.007664,
            -0.004067,  0.007689, -0.999962,
             0.999973, -0.006073, -0.004114]
      Pcl: [ -0.051018, -0.005909, -0.020881]

    time_offset: 
      imu_time_offset: 0.0
      img_time_offset: 0.0 # camera stamps are snapped to the LiDAR/trigger grid by the AVIACAM camera driver
      exposure_time_init: 0.0

    preprocess:
      point_filter_num: 1
      filter_size_surf: 0.1
      lidar_type: 1 # Livox Avia LiDAR
      scan_line: 6
      blind: 0.8

    vio:
      max_iterations: 5
      outlier_threshold: 1000 # 78 100 156 #100 200 500 700 infinite
      img_point_cov: 100 # 100 1000 
      patch_size: 8
      patch_pyrimid_level: 4
      normal_en: true
      raycast_en: false
      inverse_composition_en: false
      exposure_estimate_en: true
      inv_expo_cov: 0.1

    imu:
      imu_en: true
      imu_int_frame: 30
      acc_cov: 0.5 # 0.2
      gyr_cov: 0.3 # 0.5
      b_acc_cov: 0.0001 # 0.1
      b_gyr_cov: 0.0001 # 0.1

    lio:
      max_iterations: 5
      dept_err: 0.02
      beam_err: 0.05
      min_eigen_value: 0.0025 # 0.005
      voxel_size: 0.5
      max_layer: 2
      max_points_num: 50
      layer_init_num: [5, 5, 5, 5, 5]

    local_map:  
      map_sliding_en: false
      half_map_size: 100
      sliding_thresh: 8

    uav:
      imu_rate_odom: false
      gravity_align_en: false

    publish:
      dense_map_en: true
      pub_effect_point_en: false 
      pub_plane_en: false
      pub_scan_num: 1
      blind_rgb_points: 0.0

    evo:
      seq_name: "aviacam"
      pose_output_en: false

    pcd_save:
      pcd_save_en: false
      type: 0 # 0: World Frame, 1: Body Frame;
      colmap_output_en: false # need to set interval = -1
      filter_size_pcd: 0.15
      interval: -1
      # how many LiDAR frames saved in each pcd file;
      # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.

    image_save:
      img_save_en: false  # true = every image as PNG to Log/image (10 Hz x 1024x1280: tens of MB/s)
      interval: 1
